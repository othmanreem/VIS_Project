<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calderdale Collisions Visualization</title>
</head>

<body>
    <div id="app">
        <div id="map"></div>

        <aside id="sidebar" aria-label="Collision filters">
            <div class="sidebar-header">
                <span class="app-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M8 23L15 10L24 20" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="8" cy="23" r="3" fill="currentColor"/>
                        <circle cx="15" cy="10" r="3" fill="currentColor"/>
                        <circle cx="24" cy="20" r="3" fill="currentColor"/>
                    </svg>
                </span>
                <div>
                    <h1>IncidentVis<span class="title-dot">.</span></h1>
                    <p>Calderdale <span aria-hidden="true">/</span> 2020–2025</p>
                </div>
            </div>

            <div id="info" role="status" aria-live="polite">
                <span class="result-number">—</span>
                <div class="result-description">
                    <strong>Matching collisions</strong>
                    <span>Select years to begin</span>
                </div>
            </div>

            <div class="sidebar-body">
                <div id="year-control">
                    <div class="section-heading">
                        <h2>Years <span id="selected-years-text">0 selected</span></h2>
                        <button id="all-years-button" class="text-button" type="button">Select all</button>
                    </div>
                    <!-- Year choices and their filter editors are generated in main.js. -->
                    <div class="year-options" id="year-options"></div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div id="filter-status" role="status">Choose years to begin</div>
                <div class="filter-actions">
                    <button id="clear-button" type="button">Reset</button>
                    <button id="view-button" type="button">
                        <span>Apply filters</span><span aria-hidden="true">↗</span>
                    </button>
                </div>
                <p class="legend-caption">Point colours represent years</p>
            </div>
        </aside>

        <section id="collision-details" aria-labelledby="details-title" hidden>
            <div class="details-header">
                <h2 id="details-title">Collision details</h2>
                <button id="close-details" type="button" aria-label="Close collision details">×</button>
            </div>
            <div id="details-content"></div>
        </section>

        <div id="map-display" role="group" aria-label="Map labels">
            <div class="map-display-controls">
                <label class="label-switch">
                    <input id="show-labels" type="checkbox" role="switch">
                    <span class="switch-track" aria-hidden="true"></span>
                    <span>Labels</span>
                </label>
                <select id="label-field" aria-label="Label attribute" disabled>
                    <option value="severity">Severity</option>
                    <option value="weather">Weather</option>
                    <option value="lighting">Lighting</option>
                    <option value="roadType">Road class</option>
                </select>
            </div>
            <p id="label-status" aria-live="polite">Hover for details. Click to keep them open.</p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
